<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Community Marketplace</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F8FAFC;
            color: #0F172A;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 650px;
            background: #FFFFFF;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            color: #1E3A8A;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 10px;
            color: #64748B;
            font-size: 15px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .option {
            display: block;
            text-decoration: none;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            padding: 30px 20px;
            transition: 0.2s;
            color: #0F172A;
        }

        .option:hover {
            border-color: #2563EB;
            background: #EFF6FF;
            transform: translateY(-3px);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .option h2 {
            margin: 0 0 10px;
            color: #1E3A8A;
            font-size: 20px;
        }

        .option p {
            margin: 0;
            color: #64748B;
            font-size: 14px;
            line-height: 1.5;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #2563EB;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            .card {
                padding: 30px 20px;
            }

            .options {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        {% load static %}

        <img
            src="{% static 'images/community_logo.png' %}"
            alt="Community Marketplace"
            class="logo"
        >

        <h1>Create Your Account</h1>

        <p class="subtitle">
            Choose how you want to use Community Marketplace
        </p>

        <div class="options">

            <!-- CUSTOMER -->

            <a href="{% url 'register' %}" class="option">

                <div class="icon">
                    👤
                </div>

                <h2>Customer</h2>

                <p>
                    Find local service providers and book services
                    for your needs.
                </p>

            </a>


            <!-- SERVICE PROVIDER -->

            <a href="{% url 'provider_register' %}" class="option">

                <div class="icon">
                    🛠️
                </div>

                <h2>Service Provider</h2>

                <p>
                    Offer your services and receive bookings
                    from customers.
                </p>

            </a>

        </div>

        <a href="{% url 'home' %}" class="back">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
